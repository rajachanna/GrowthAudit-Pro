name: GrowthAudit Pro — security, scanner and dashboard
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python checks
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax and static assets
        run: |
          node --check web/app.js
          python - <<'PY'
          from pathlib import Path
          html=Path("web/index.html").read_text()
          assert "/growth-audit.css" in html
          assert "/growth-audit.js" in html
          assert 'canonical' in html
          assert "Core Web Vitals" in html
          from growthaudit.serverless import handle_request
          import json
          status,body=handle_request("GET","/api/growth-audit/health")
          assert status==200 and json.loads(body)["ok"]
          print("UI assets and health response verified")
          PY
      - name: Build installable CLI wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/wheels .
          python - <<'PY'
          import zipfile,glob
          wheels=glob.glob("/tmp/wheels/*.whl")
          assert len(wheels)==1
          with zipfile.ZipFile(wheels[0]) as z:
              names=z.namelist()
              for path in ("growthaudit/engine.py","growthaudit/fetch.py","growthaudit/security.py","growthaudit/serverless.py"):
                  assert any(n.endswith(path) for n in names),path
          print("Packaged audit engine, serverless HTTP adapter and pinned DNS policy")
          PY
